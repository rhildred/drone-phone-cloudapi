---
- name: Install Caddy and Mosquitto locally
  hosts: localhost
  connection: local
  become: true

  tasks:
    # Matches: sudo apt install -y debian-keyring debian-archive-keyring apt-transport-https curl gnupg
    - name: Install prerequisite dependencies
      ansible.builtin.apt:
        name:
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
          - gnupg
        state: present
        update_cache: true

    # Matches: curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
    # Note: Cloudsmith delivers an armored file that modern apt handles cleanly if named with .gpg or .asc
    - name: Download Caddy official GPG key
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        mode: '0644' # Matches: sudo chmod o+r /usr/share/keyrings/caddy-stable-archive-keyring.gpg

    # Matches: curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
    - name: Fetch and write official Caddy repository source file
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt
        dest: /etc/apt/sources.list.d/caddy-stable.list
        mode: '0644' # Matches: sudo chmod o+r /etc/apt/sources.list.d/caddy-stable.list

    # Matches: sudo apt update && sudo apt install caddy mosquitto mosquitto-clients
    - name: Update apt cache and install applications
      ansible.builtin.apt:
        name:
          - caddy
          - mosquitto
          - mosquitto-clients
        state: present
        update_cache: true # Forces the "sudo apt update" step immediately after adding the source

    # --- SYSTEMD SERVICE MANAGEMENT ---
    - name: Ensure Caddy and Mosquitto are enabled and running via systemctl
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - caddy
        - mosquitto
