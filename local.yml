---
- name: Install Caddy and Mosquitto locally
  hosts: localhost
  connection: local
  become: true
  vars:
    # Safely fallback to ansible_user if ansible_env.USER is unavailable
    original_user: "{{ ansible_facts['env']['USER'] | default(ansible_user) }}"
  tasks:
    # 1. Install prerequisites
    - name: Install prerequisite dependencies
      ansible.builtin.apt:
        name:
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
          - gnupg
          - mosquitto
          - mosquitto-clients
        state: present
        update_cache: true

    - name: Download and dearmor Caddy GPG key safely for both Debian and Ubuntu
      ansible.builtin.shell: |
        set -o pipefail
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor --yes -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      args:
        executable: /bin/bash
        creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      become: true

    - name: Securely add Caddy APT repository list file
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt
        dest: /etc/apt/sources.list.d/caddy-stable.list
        mode: '0644'
      become: true

    - name: Install Caddy package
      ansible.builtin.apt:
        name: caddy
        state: present
        update_cache: true
      become: true
    # 5. Prepare the system path for the MediaMTX binary execution
    - name: Ensure MediaMTX directory exists
      ansible.builtin.file:
        path: /opt/mediamtx
        state: directory
        mode: '0755'

    # 6. download mediamtx
    - name: Download and install the latest MediaMTX binary safely
      ansible.builtin.shell: |
        set -o pipefail
        curl -sL https://github.com/bluenviron/mediamtx/releases/download/v1.20.1/mediamtx_v1.20.1_linux_amd64.tar.gz | tar -xz -C /opt/mediamtx
      args:
        executable: /bin/bash
        creates: /opt/mediamtx/mediamtx

    # 7. Write the systemd unit file for MediaMTX tracking
    - name: Create Systemd service unit for MediaMTX
      ansible.builtin.copy:
        dest: /etc/systemd/system/mediamtx.service
        mode: '0644'
        content: |
          [Unit]
          Description=MediaMTX Live Video Streaming Server
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/mediamtx
          ExecStart=/opt/mediamtx/mediamtx
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Copy gateway-services folder to /opt
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/gateway-services"
        dest: /opt/
        owner: "{{ original_user }}"
        group: "{{ original_user }}"
        mode: 'u=rwX,g=rX,o=rX' # Sets folders to 755 and files to 644 automatically
      become: true

    - name: Initialize venv and install Python requirements
      ansible.builtin.pip:
        requirements: /opt/gateway-services/requirements.txt
        virtualenv: /opt/gateway-services/venv
        virtualenv_command: python3 -m venv

    - name: Create caddy-ask-api service
      ansible.builtin.copy:
        dest: /etc/systemd/system/caddy-ask-api.service
        mode: '0644'
        content: |
          [Unit]
          Description=FastAPI Caddy On-Demand TLS Regular Expression Evaluator
          After=network.target

          [Service]
          Type=simple
          User=root
          Group=root
          WorkingDirectory=/opt/gateway-services
          # Call the uvicorn binary directly from the shared venv
          ExecStart=/opt/gateway-services/venv/bin/uvicorn caddy_ask_api:app --host 127.0.0.1 --port 9000
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
      become: true          

    - name: Ensure caddy-ask-api is enabled and active
      ansible.builtin.systemd:
        name: caddy-ask-api
        state: started
        enabled: true
      become: true
        
    # 8. Manage services with systemctl
    - name: Ensure Caddy and Mosquitto are enabled and running via systemctl
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - caddy
        - mosquitto
        - mediamtx
