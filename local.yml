---
- name: Install Caddy and Mosquitto locally
  hosts: localhost
  connection: local
  become: true

  tasks:
    # 1. Matches: sudo apt install -y debian-keyring debian-archive-keyring apt-transport-https curl
    - name: Install prerequisite Caddy dependencies
      ansible.builtin.apt:
        name:
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
          - gnupg
        state: present
        update_cache: true

    # 2. Replaces the curl | gpg pipeline to cleanly download the armored key directly as an ASCII armored block
    # Note: Modern apt reads .asc text files perfectly without needing the legacy dearmor step
    - name: Download Caddy public GPG key
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        mode: '0644' # Matches: sudo chmod o+r /usr/share/keyrings/caddy-stable-archive-keyring.gpg

    # 3. Matches the destination of: /etc/apt/sources.list.d/caddy-stable.list
    - name: Add Caddy repository source definition
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any main"
        filename: caddy-stable
        mode: '0644' # Matches: sudo chmod o+r /etc/apt/sources.list.d/caddy-stable.list
        state: present

    # 4. Matches: sudo apt install caddy (and pulls mosquitto from native repos)
    - name: Install Caddy and Mosquitto applications
      ansible.builtin.apt:
        name:
          - caddy
          - mosquitto
          - mosquitto-clients
        state: present
        update_cache: true

    # 5. Configures services with systemctl
    - name: Ensure Caddy and Mosquitto are enabled and running
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - caddy
        - mosquitto
