<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drone System: Dynamic Subscriber Monitor</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; color: #333; }
        h2 { margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; }
        .drone-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 5px solid #0056b3; }
        .drone-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #0056b3; display: flex; justify-content: space-between; }
        .telemetry-data { background: #f8f9fa; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 13px; margin-bottom: 10px; line-height: 1.4; }
        video { background: #000; width: 100%; aspect-ratio: 16/9; display: block; border-radius: 4px; }
        .stale { opacity: 0.6; border-top-color: #6c757d; }
    </style>
    
    <!-- Include Paho MQTT Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"
        type="text/javascript"></script>
    <script type="module">
        const componentUrl = new URL(import.meta.url);
        
        // Listen to all telemetry under this path using the '+' wildcard
        const wildcardTopic = "test/mqtt/websocket/+";
        const mqttUrl = import.meta.url.replace(/^http/, "ws").replace(componentUrl.pathname, "/mqtt");

        const clientID = "sub_monitor_" + Math.random().toString(16).substr(2, 8);
        const mqttClient = new Paho.Client(mqttUrl, clientID);

        // Track active drone connections to prevent duplicate WebRTC configurations
        const activeDrones = {}; 

        mqttClient.onConnectionLost = (response) => {
            console.log("MQTT Connection Lost: " + response.errorMessage);
        };

        mqttClient.onMessageArrived = (message) => {
            const topicParts = message.destinationName.split('/');
            const soakId = topicParts[topicParts.length - 1]; // Pulls 'soak_XXXX'
            
            try {
                const telemetry = JSON.parse(message.payloadString);
                
                // If this is a new soak test node, create its card and connect video stream
                if (!activeDrones[soakId]) {
                    createNewDroneCard(soakId);
                }
                
                // Update UI readouts
                updateTelemetryUI(soakId, telemetry);
            } catch (e) {
                console.error("Failed to parse telemetry JSON", e);
            }
        };

        function connectMQTT() {
            mqttClient.connect({
                onSuccess: () => {
                    console.log("Connected to MQTT Broker");
                    mqttClient.subscribe(wildcardTopic);
                },
                onFailure: (res) => { console.error("MQTT Connection Failed: " + res.errorMessage); },
                useSSL: componentUrl.protocol === 'https:'
            });
        }

        function createNewDroneCard(soakId) {
            activeDrones[soakId] = {
                lastSeen: Date.now(),
                peerConnection: null
            };

            const grid = document.getElementById("droneGrid");

            // Build structural Card DOM elements
            const card = document.createElement("div");
            card.className = "drone-card";
            card.id = `card-${soakId}`;

            card.innerHTML = `
                <div class="drone-title">
                    <span>Target: ${soakId}</span>
                    <span id="time-${soakId}" style="font-size:12px; color:#666;">Connecting...</span>
                </div>
                <div class="telemetry-data" id="telemetry-${soakId}">
                    Waiting for initial packet...
                </div>
                <video id="video-${soakId}" autoplay playsinline muted controls></video>
            `;

            grid.appendChild(card);

            // Hook up MediaMTX WebRTC (WHEP) subscriber stream for this specific target
            startWhepSubscription(soakId);
        }

        function updateTelemetryUI(soakId, data) {
            activeDrones[soakId].lastSeen = Date.now();
            
            const card = document.getElementById(`card-${soakId}`);
            if(card) card.classList.remove("stale");

            const timeEl = document.getElementById(`time-${soakId}`);
            if (timeEl) timeEl.textContent = `Tx Clock: ${data.timestamp || 'N/A'}`;

            const telEl = document.getElementById(`telemetry-${soakId}`);
            if (telEl) {
                telEl.innerHTML = `
                    LAT:  ${data.latitude}<br>
                    LNG:  ${data.longitude}<br>
                    HEAD: ${data.heading}° | MODE: ${data.mode || 'SIM'}
                `;
            }
        }

        async function startWhepSubscription(soakId) {
            const whepEndpoint = `${componentUrl.protocol}//${componentUrl.host}/mediamtx/${soakId}/whep`;
            const videoEl = document.getElementById(`video-${soakId}`);

            try {
                const pc = new RTCPeerConnection({ iceServers: [] });
                activeDrones[soakId].peerConnection = pc;

                // Add empty video/audio transceivers expecting tracks from MediaMTX
                pc.addTransceiver('video', { direction: 'recvonly' });
                pc.addTransceiver('audio', { direction: 'recvonly' });

                pc.ontrack = (event) => {
                    if (videoEl.srcObject !== event.streams[0]) {
                        videoEl.srcObject = event.streams[0];
                    }
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const response = await fetch(whepEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/sdp' },
                    body: offer.sdp
                });

                if (!response.ok) throw new Error(`WHEP endpoint returned code ${response.status}`);

                const answerSdp = await response.text();
                await pc.setRemoteDescription(new RTCSessionDescription({
                    type: 'answer',
                    sdp: answerSdp
                }));

            } catch (err) {
                console.error(`WHEP configuration error for ${soakId}:`, err);
            }
        }

        // Monitor loop to grey out cards if a soak test tab closes or stops updating
        setInterval(() => {
            const now = Date.now();
            Object.keys(activeDrones).forEach(soakId => {
                if (now - activeDrones[soakId].lastSeen > 4000) {
                    const card = document.getElementById(`card-${soakId}`);
                    if (card) card.classList.add("stale");
                }
            });
        }, 2000);

        document.addEventListener("DOMContentLoaded", connectMQTT);
    </script>
</head>
<body>

    <h2>Drone-Phone System: Master Dynamic Receiver Monitoring Dashboard</h2>
    <div class="grid" id="droneGrid"></div>

</body>
</html>
