<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drone-Phone Subscriber Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f9f9; color: #333; }
        .dashboard { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 15px; }
        video { background: #000; width: 640px; height: 360px; display: block; border-radius: 4px; }
        .telemetry-panel { background: #fff; padding: 15px; border-radius: 4px; border: 1px solid #ddd; min-width: 250px; }
        .status-box { margin-bottom: 10px; font-size: 14px; }
        .status-val { font-weight: bold; color: #0056b3; }
        button { padding: 10px 20px; font-size: 14px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: #007bff; color: white; font-weight: bold; }
    </style>

    <!-- Include Paho MQTT Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"
        type="text/javascript"></script>
    
    <script type="module">
        const componentUrl = new URL(import.meta.url);
        const streamName = 'mystream'; 
        const topic = "test/mqtt/websocket/123";
        
        const whepEndpoint = `${componentUrl.protocol}//${componentUrl.host}/mediamtx/${streamName}/whep`;
        const mqttUrl = import.meta.url.replace(/^http/, "ws").replace(componentUrl.pathname, "/mqtt");

        const clientID = "sub_client_" + Math.random().toString(16).substr(2, 8);
        const mqttClient = new Paho.Client(mqttUrl, clientID);

        let peerConnection;

        // --- MQTT Setup & Handlers ---
        mqttClient.onConnectionLost = (response) => {
            if (response.errorCode !== 0) document.getElementById("mqttStatus").innerHTML = "Lost: " + response.errorMessage;
        };

        mqttClient.onMessageArrived = (message) => {
            try {
                const data = JSON.parse(message.payloadString);
                document.getElementById("latVal").textContent = data.latitude.toFixed(6);
                document.getElementById("lngVal").textContent = data.longitude.toFixed(6);
                document.getElementById("timeVal").textContent = data.timestamp;
            } catch (e) {
                console.error("Error parsing telemetry payload:", e);
            }
        };

        function startMqttConnect() {
            document.getElementById("mqttStatus").innerHTML = "Connecting...";
            mqttClient.connect({
                onSuccess: () => {
                    document.getElementById("mqttStatus").innerHTML = "Connected";
                    document.getElementById("mqttStatus").style.color = "green";
                    mqttClient.subscribe(topic);
                },
                onFailure: (res) => { document.getElementById("mqttStatus").innerHTML = "Failed: " + res.errorMessage; },
                useSSL: componentUrl.protocol === 'https:'
            });
        }

        // --- WebRTC WHEP Playback Execution ---
        async function startPlayback() {
            const videoStatusEl = document.getElementById("videoStatus");
            const videoEl = document.getElementById("remoteVideo");
            videoStatusEl.textContent = "Connecting to stream...";

            // Wire up incoming MQTT metrics loop simultaneously
            startMqttConnect();

            peerConnection = new RTCPeerConnection({ iceServers: [] });

            // 3. Mount incoming video and audio tracks directly into the DOM
            peerConnection.ontrack = (event) => {
                // Change event.streams to event.streams[0]
                if (videoEl.srcObject !== event.streams[0]) {
                    videoEl.srcObject = event.streams[0]; // 👈 Fix applied here
                    videoStatusEl.textContent = "Streaming Live!";
                    videoStatusEl.style.color = "green";
                }
            };
            
            peerConnection.addTransceiver('video', { direction: 'recvonly' });
            peerConnection.addTransceiver('audio', { direction: 'recvonly' });

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            try {
                const response = await fetch(whepEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/sdp' },
                    body: offer.sdp
                });

                if (!response.ok) throw new Error(`Server returned status ${response.status}`);

                const answerSdp = await response.text();
                await peerConnection.setRemoteDescription(new RTCSessionDescription({
                    type: 'answer',
                    sdp: answerSdp
                }));

            } catch (error) {
                videoStatusEl.textContent = `Error: ${error.message}`;
                videoStatusEl.style.color = "red";
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("playBtn").addEventListener("click", startPlayback);
        });
    </script>
</head>
<body>

    <h2>Drone-Phone System: Control Dashboard</h2>
    
    <div class="status-box">Video Feed: <span id="videoStatus" class="status-val">Ready</span></div>
    <div class="status-box">Telemetry Link: <span id="mqttStatus" class="status-val">Disconnected</span></div>

    <button id="playBtn">Connect Dashboard</button>
    
    <div class="dashboard">
        <!-- Live Video Element -->
        <video id="remoteVideo" autoplay playsinline controls></video>
        
        <!-- Live Telemetry Data Box -->
        <div class="telemetry-panel">
            <h3>Live Telemetry</h3>
            <p><strong>Latitude:</strong> <span id="latVal">---</span></p>
            <p><strong>Longitude:</strong> <span id="lngVal">---</span></p>
            <p><strong>Last Updated:</strong> <span id="timeVal">---</span></p>
        </div>
    </div>

</body>
</html>
