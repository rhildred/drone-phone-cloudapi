<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MediaMTX WHIP WebRTC Publisher</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f9f9; color: #333; }
        video { background: #000; width: 640px; height: 360px; display: block; margin-top: 15px; border-radius: 4px; transform: scaleX(1); }
        #status { font-weight: bold; color: #0056b3; }
        button { padding: 10px 20px; font-size: 14px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: #28a745; color: white; font-weight: bold; }
    </style>
    
    <script type="module">
        const componentUrl = new URL(import.meta.url);
        const streamName = 'mystream'; 
        
        // Target your Caddy 'handle_path /mediamtx/*' block, pointing to WHIP instead of WHEP
        const whipEndpoint = `${componentUrl.protocol}//${componentUrl.host}/mediamtx/${streamName}/whip`;

        let peerConnection;
        let localStream;

        async function startPublishing() {
            const statusEl = document.getElementById("status");
            const videoEl = document.getElementById("localVideo");
            statusEl.textContent = "Requesting rear camera access...";

            try {
                // 1. Force mobile browser to select the environment (back/rear) camera
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }, 
                    audio: true
                });
                
                // Show local camera preview on the phone screen
                videoEl.srcObject = localStream;
                statusEl.textContent = "Connecting to MediaMTX WHIP server...";

                // 2. Initialize Peer Connection with zero cloud/STUN dependencies
                peerConnection = new RTCPeerConnection({ iceServers: [] });

                // 3. Inject our phone camera video/audio tracks into the Peer Connection
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                // 4. Generate local SDP Offer to send video
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                // 5. POST the stream configurations to Caddy -> MediaMTX WHIP
                const response = await fetch(whipEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/sdp' },
                    body: offer.sdp
                });

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                // 6. Apply the resulting SDP Answer from MediaMTX to start broadcasting
                const answerSdp = await response.text();
                await peerConnection.setRemoteDescription(new RTCSessionDescription({
                    type: 'answer',
                    sdp: answerSdp
                }));

                statusEl.textContent = "Broadcasting Live from Rear Camera!";
                statusEl.style.color = "green";

            } catch (error) {
                // Fallback: If 'exact: "environment"' fails (e.g., testing on a desktop webcam)
                if (error.name === "OverconstrainedError" || error.name === "NotFoundError") {
                    statusEl.textContent = "Rear camera not found. Trying default camera...";
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                        videoEl.srcObject = localStream;
                        // Retry the WebRTC handshake logic here if needed
                    } catch (innerError) {
                        statusEl.textContent = `Camera Error: ${innerError.message}`;
                    }
                } else {
                    statusEl.textContent = `Error: ${error.message}`;
                    statusEl.style.color = "red";
                }
                console.error("WebRTC WHIP Publishing failed:", error);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("publishBtn").addEventListener("click", startPublishing);
        });
    </script>
</head>
<body>

    <h2>MediaMTX WebRTC Publisher</h2>
    <p>Status: <span id="status">Ready</span></p>

    <button id="publishBtn">Start Broadcast</button>
    
    <video id="localVideo" autoplay playsinline muted></video>

</body>
</html>
